<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennisspiel</title>
  </head>
  <body>
    <div
      style="
        width: 500px;
        height: 500px;
        background-color: rgb(105, 241, 60);
        position: relative;
      "
      id="Feld"
      onmousemove="
        eigenerSchlägerPos = event.clientX;
        schläger2.style.left = eigenerSchlägerPos - 70 + 'px';
      "
    >
      <img
        id="Schläger1"
        src="tennisschläger.png"
        alt=""
        width="100"
        height="100"
        style="position: absolute; left: 200px; top: 1px"
      /><img
        id="Schläger2"
        src="tennisschläger.png"
        alt=""
        width="100"
        height="100"
        style="position: absolute; left: 200px; top: 380px"
      />

      <img
        id="tennisball"
        src="tennisball.png"
        alt=""
        width="50"
        height="50"
        style="position: absolute; left: 225px; top: 225px"
      />
    </div>
    <script>
      const feld = document.getElementById("Feld");
      const schläger2 = document.getElementById("Schläger2");
      const schlaeger1 = document.getElementById("Schläger1");
      schlaeger1.style.left = "px";
      const tennisball = document.getElementById("tennisball");
      let position = 0;
      let width = 400;
      let height = 400;
      let counter = 1;
      let ballxposition = 100;
      let ballyposition = 0;
      let ballxcounter = 1;
      let ballycounter = 2;
      let eigenerSchlägerPos = 0;

      setInterval(function () {
        position = position + counter;
        schlaeger1.style.left = position + "px";
        if (position > width) {
          counter = -1;
        }
        if (position < 0) {
          counter = 1;
        }

        ballxposition = ballxposition + ballxcounter;
        tennisball.style.left = ballxposition + "px";
        if (ballxposition > width + 50) {
          ballxcounter = -1;
        }
        if (ballxposition < 0) {
          ballxcounter = 1;
        }
        ballyposition = ballyposition + ballycounter;
        tennisball.style.top = ballyposition + "px";
        if (ballyposition > height) {
          ballycounter = -2;
          if (
            ballxposition > eigenerSchlägerPos - 40 + 30 ||
            ballxposition < eigenerSchlägerPos - 40 - 30
          ) {
            alert("Verloren");
          }
        }
        if (ballyposition < 0) {
          ballycounter = 2;
        }
      }, 1);
    </script>
  </body>
</html>
