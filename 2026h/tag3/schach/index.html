<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schach</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f7f2;
        text-align: center;
        margin: 0;
        color: #294b3a;
      }

      .container {
        margin: 60px auto;
        padding: 20px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 15px;
      }

      p {
        color: #555;
        font-size: 18px;
      }

      .schachbild {
        width: 260px;
        height: 180px;
        object-fit: cover;
        border-radius: 10px;
        margin: 25px 0;
      }

      a {
        display: inline-block;
        background-color: #35664b;
        color: white;
        padding: 12px 25px;
        text-decoration: none;
        border-radius: 6px;
        margin-top: 15px;
      }

      a:hover {
        background-color: #244832;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Willkommen zu meinem Schachspiel!</h1>

      <p>Spiele hier Schach gegen deine Freunde.</p>

      <img
        class="schachbild"
        src="https://images.unsplash.com/photo-1586165368502-1bad197a6461?auto=format&fit=crop&w=700&q=80"
        alt="Schachfiguren auf einem Schachbrett"
      />

      <br />

      <a href="./Seite Schachspiel.html">Zum Spiel →</a>
