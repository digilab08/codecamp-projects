    <p id="ausgabe"></p>
    <script>
      let ausgabe = document.getElementById("ausgabe");
      let figur;
      let aktuellefarbe = "weiß";

      function ablegen(el) {
        if (!figur) {
          return;
        }

        if (!figur.classList.contains(aktuellefarbe)) {
          return;
        }

        if (el === figur.parentElement) {
          return;
        }

        let ziel = el.id;
        let istBauer = figur.classList.contains("bauer");

        if (el.children.length > 0) {
          let geschlageneFigur = el.children[0];

          if (geschlageneFigur.classList.contains(aktuellefarbe)) {
            return;
          }
        }
        el.textContent = "";
        el.appendChild(figur);

        if (istBauer) {
          ausgabe.textContent += " " + ziel;
        } else {
          ausgabe.textContent += " " + figur.classList[0] + "-" + ziel;
        }

        if (aktuellefarbe === "weiß") {
          aktuellefarbe = "schwarz";
        } else {
          aktuellefarbe = "weiß";
        }
      }
    </script>
