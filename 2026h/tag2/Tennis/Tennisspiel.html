<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennisspiel</title>
  </head>
  <body>
    <div
      style="
        width: 500px;
        height: 500px;
        background-color: rgb(105, 241, 60);
        position: relative;
      "
      id="Feld"
    >
      <img
        id="Schläger1"
        src="tennisschläger.png"
        alt=""
        width="100"
        height="100"
        style="position: absolute; left: 200px; top: 1px"
      />
      <img
        id="Schläger2"
        src="tennisschläger.png"
        alt=""
        width="100"
        height="100"
        style="position: absolute; left: 200px; top: 400px"
      />
    </div>
    <script>
      const feld = document.getElementById("Feld");
      const schlaeger1 = document.getElementById("Schläger1");
      schlaeger1.style.left = "px";
      let position = 0;
      let width = 400;
      let counter = 1;

      setInterval(function () {
        position = position + counter;
        schlaeger1.style.left = position + "px";
        if (position > width) {
          counter = -1;
        }
        if (position < 0) {
          counter = 1;
        }
      }, 1);
    </script>
  </body>
</html>
