    <script>
      let Punkte = 0;
      let color;
      function thema(color) {
        if (color == "green") {
          Punkte += 1;
          if (Punkte > 6) {
            Punkte = 6;
          }
        } else {
          Punkte -= 1;
          if (Punkte < 0) {
            Punkte = 0;

        document.getElementById("ergebnis").innerText = Punkte;
